name: Website

# Builds the app with its sign-in and publishes it to the gh-pages branch, which GitHub Pages
# serves at https://<owner>.github.io/<repository>/. Runs on every push to main in the public
# test repository (crdtrunblitz) only.
#
# The sign-in hash is the SHA-256 of "crdtrade:<user>:<password>" (user in lower case). The
# website is static, so the hash ships with the page: it keeps casual visitors out of a
# paper-money app, nothing more.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'Karan2009lion/crdtrunblitz'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build
        env:
          VITE_LOGIN_HASH: b46bc4e272e54dd513c8d523ec09702f51ee1bc5892a448d8022f0f18b56ac79
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Website built from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
